# ForkPlus-Next 三平台自动构建
#
# 触发：push 到 master / 手动 / PR
# （主分支已由 main 改名 master，2026-08-30）
# 产物：framework-dependent publish 目录（需目标机安装 .NET 10 运行时），含各平台
#       biturbo native 库（构建期由 workflow 显式 curl + ForkPlus.csproj 的 RestoreBiturbo
#       Target 兜底，从 hebin123456/Biturbo latest release 拉取：win→biturbo.dll /
#       linux→libbiturbo.so / macos→libbiturbo.dylib）+ tokei 代码统计工具（hebin123456/tokei
#       latest release：win→tokei.exe / unix→tokei，Linux/macOS 为 tar.gz 需解压）+
#       AskPass/RI 子进程三件套（apphost/dll/runtimeconfig）。
#
# 平台对应关系（与 Biturbo release 资产架构一致）：
#   windows-latest → x64（biturbo.dll = x86_64）
#   ubuntu-latest  → x64（libbiturbo.so = x86_64）
#   macos-latest   → arm64（libbiturbo.dylib = arm64，Apple Silicon）
#
# 注意：解决方案里的 ForkPlus.AutomationTests（FlaUI，Windows-only）不在构建范围，
#       只构建主工程 ForkPlus.csproj（ProjectReference 会带出 AskPass/RI）。

name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rid: win-x64
            platformtarget: x64
          - os: ubuntu-latest
            name: linux-x64
            rid: linux-x64
            platformtarget: x64
          - os: macos-latest
            name: macos-arm64
            rid: osx-arm64
            platformtarget: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # OxyPlot.Avalonia 从仓库内置 src/ThirdParty 迁移为仓库外本地源码引用
      # （ForkPlus.csproj: ..\..\..\oxyplot-avalonia\Source\OxyPlot.Avalonia）。
      # csproj 引用路径相对 $GITHUB_WORKSPACE 的上一级目录，故 clone 到 ../oxyplot-avalonia。
      # 官方 oxyplot/oxyplot-avalonia 源码随主工程一起按 Avalonia 12 编译，无需单独发版。
      - name: Clone OxyPlot.Avalonia source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/oxyplot/oxyplot-avalonia.git ../oxyplot-avalonia
          test -f ../oxyplot-avalonia/Source/OxyPlot.Avalonia/OxyPlot.Avalonia.csproj \
            || { echo "OxyPlot.Avalonia.csproj not found after clone"; exit 1; }

      # TODO 迁移（CI）：native 库下载走显式 step 而非只靠 csproj 的 RestoreBiturbo Target
      # —— macOS runner 上该 MSBuild Exec 未产出 dylib（Linux/Windows 均正常，minimal
      # verbosity 下 Exec stdout 也不进日志，无从诊断），改为 workflow 显式 curl：
      # 日志可见、重试明确、每平台文件名写死，下载后 csproj 的 Exists 守卫直接短路。
      - name: Download biturbo native library
        shell: bash
        run: |
          mkdir -p third_party
          base="https://github.com/hebin123456/Biturbo/releases/latest/download"
          case "${{ matrix.name }}" in
            windows-x64) native=biturbo.dll ;;
            linux-x64)   native=libbiturbo.so ;;
            macos-arm64) native=libbiturbo.dylib ;;
          esac
          echo "Downloading $native ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$native" -o "third_party/$native"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $native after 5 attempts"; exit 1; }
          ls -la "third_party/$native"
          # 非空且 >1MB 校验（biturbo 约 2-3MB；curl 失败残留 0 字节文件的情况要拦住）
          size=$(wc -c < "third_party/$native")
          [ "$size" -gt 1000000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      # TODO 迁移（CI）：tokei 与 biturbo 同模式显式下载（不走 csproj 的 RestoreTokei Exec，
      # 规避 macOS runner 上 MSBuild Exec 行为差异）。三平台资产：
      #   windows → tokei-x86_64-pc-windows-msvc.exe（裸 exe，存为 tokei.exe）
      #   linux   → tokei-x86_64-unknown-linux-gnu.tar.gz（tar 内是裸 tokei，解压存为 tokei）
      #   macos   → tokei-x86_64-apple-darwin.tar.gz（同上；release 暂无 aarch64-apple-darwin
      #             资产，arm64 目标机经 Rosetta 2 运行——CI 只打包不执行，不受影响）
      - name: Download tokei
        shell: bash
        run: |
          mkdir -p third_party
          base="https://github.com/hebin123456/tokei/releases/latest/download"
          case "${{ matrix.name }}" in
            windows-x64) asset="tokei-x86_64-pc-windows-msvc.exe"; out="third_party/tokei.exe"; bare=1 ;;
            linux-x64)   asset="tokei-x86_64-unknown-linux-gnu.tar.gz"; out="third_party/tokei"; bare=0 ;;
            macos-arm64) asset="tokei-x86_64-apple-darwin.tar.gz"; out="third_party/tokei"; bare=0 ;;
          esac
          echo "Downloading $asset ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$asset" -o "third_party/tokei-download"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $asset after 5 attempts"; exit 1; }
          if [ "$bare" = "1" ]; then
            mv "third_party/tokei-download" "$out"
          else
            # tar.gz 内是裸 tokei 二进制（无目录结构），解压到临时目录再就位
            tmp=$(mktemp -d)
            tar -xzf "third_party/tokei-download" -C "$tmp" || { echo "FAILED to extract $asset"; exit 1; }
            [ -f "$tmp/tokei" ] || { echo "archive does not contain bare 'tokei' binary"; ls -la "$tmp"; exit 1; }
            mv "$tmp/tokei" "$out"
            rm -rf "$tmp" "third_party/tokei-download"
          fi
          chmod +x "$out" || true
          ls -la "$out"
          # 非空且 >1MB 校验（解压后二进制约 2-7MB；拦 0 字节/截断残留）
          size=$(wc -c < "$out")
          [ "$size" -gt 1000000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      # RID-specific publish：只保留本平台 native 库并提升到产物根目录。
      # 不带 -r 时 SDK 会把 NuGet 包里全部 18 个 RID 的 runtimes/ 复制进产物
      # （SkiaSharp/HarfBuzzSharp 全平台 so/dylib/dll + pdb 调试符号），Linux 包
      # 膨胀到 585M；带 -r linux-x64 --self-contained false 后降至约 45M。
      # DebugType=none / AllowedReferenceRelatedFileExtensions=none 去掉 pdb。
      # PlatformTarget 按 RID 传：csproj 固定 x64 会与 osx-arm64 冲突（NETSDK1032）。
      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/ForkPlus/ForkPlus.csproj -c Release
          -r ${{ matrix.rid }} --self-contained false
          -p:PlatformTarget=${{ matrix.platformtarget }}
          -p:DebugType=none -p:AllowedReferenceRelatedFileExtensions=none
          -o publish/${{ matrix.rid }} --nologo

      - name: Verify critical outputs
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          # Windows 的 apphost 带 .exe 扩展名，Unix 是无扩展名可执行文件
          if [ "${{ matrix.name }}" = "windows-x64" ]; then ext=".exe"; else ext=""; fi
          missing=0
          for f in ForkPlus.dll ForkPlus.runtimeconfig.json \
                   "ForkPlus.AskPass${ext}" ForkPlus.AskPass.dll ForkPlus.AskPass.runtimeconfig.json \
                   "ForkPlus.RI${ext}" ForkPlus.RI.dll; do
            [ -f "$f" ] || { echo "MISSING: $f"; missing=1; }
          done
          case "${{ matrix.name }}" in
            windows-x64) native=biturbo.dll; tokei_file=tokei.exe ;;
            linux-x64)   native=libbiturbo.so; tokei_file=tokei ;;
            macos-arm64) native=libbiturbo.dylib; tokei_file=tokei ;;
          esac
          [ -f "$native" ] || { echo "MISSING native: $native"; missing=1; }
          [ -f "$tokei_file" ] || { echo "MISSING tokei: $tokei_file"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All critical outputs present (native=$native, tokei=$tokei_file)."

      # 直接上传产物目录内容，不再先打 tar.gz/zip：
      # GitHub Actions 下载 artifact 时本身就会自动包一层 zip（无法关闭），
      # 先自己打包再上传 = 解压一次拿到的是内层压缩包，还得再解压一次（两层嵌套）。
      # 上传目录内容（LCA = publish/<rid>）→ 下载的 artifact zip 解压即得全部文件，只有一层。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForkPlus-${{ matrix.name }}
          path: publish/${{ matrix.rid }}/*
          retention-days: 14
          if-no-files-found: error
