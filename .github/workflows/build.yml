# ForkPlus-Next 三平台自动构建
#
# 触发：push 到 main / 手动 / PR
# 产物：framework-dependent publish 目录（需目标机安装 .NET 10 运行时），含各平台
#       biturbo native 库（构建期由 ForkPlus.csproj 的 RestoreBiturbo Target 自动从
#       hebin123456/Biturbo latest release 拉取：win→biturbo.dll / linux→libbiturbo.so /
#       macos→libbiturbo.dylib）+ AskPass/RI 子进程三件套（apphost/dll/runtimeconfig）。
#
# 平台对应关系（与 Biturbo release 资产架构一致）：
#   windows-latest → x64（biturbo.dll = x86_64）
#   ubuntu-latest  → x64（libbiturbo.so = x86_64）
#   macos-latest   → arm64（libbiturbo.dylib = arm64，Apple Silicon）
#
# 注意：解决方案里的 ForkPlus.AutomationTests（FlaUI，Windows-only）不在构建范围，
#       只构建主工程 ForkPlus.csproj（ProjectReference 会带出 AskPass/RI）。

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            name: linux-x64
            rid: linux-x64
            ext: tar.gz
          - os: macos-latest
            name: macos-arm64
            rid: osx-arm64
            ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # TODO 迁移（CI）：native 库下载走显式 step 而非只靠 csproj 的 RestoreBiturbo Target
      # —— macOS runner 上该 MSBuild Exec 未产出 dylib（Linux/Windows 均正常，minimal
      # verbosity 下 Exec stdout 也不进日志，无从诊断），改为 workflow 显式 curl：
      # 日志可见、重试明确、每平台文件名写死，下载后 csproj 的 Exists 守卫直接短路。
      - name: Download biturbo native library
        shell: bash
        run: |
          mkdir -p third_party
          base="https://github.com/hebin123456/Biturbo/releases/latest/download"
          case "${{ matrix.name }}" in
            windows-x64) native=biturbo.dll ;;
            linux-x64)   native=libbiturbo.so ;;
            macos-arm64) native=libbiturbo.dylib ;;
          esac
          echo "Downloading $native ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$native" -o "third_party/$native"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $native after 5 attempts"; exit 1; }
          ls -la "third_party/$native"
          # 非空且 >1MB 校验（biturbo 约 2-3MB；curl 失败残留 0 字节文件的情况要拦住）
          size=$(wc -c < "third_party/$native")
          [ "$size" -gt 1000000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      - name: Publish (framework-dependent)
        run: dotnet publish src/ForkPlus/ForkPlus.csproj -c Release -o publish/${{ matrix.rid }} --nologo

      - name: Verify critical outputs
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          # Windows 的 apphost 带 .exe 扩展名，Unix 是无扩展名可执行文件
          if [ "${{ matrix.name }}" = "windows-x64" ]; then ext=".exe"; else ext=""; fi
          missing=0
          for f in ForkPlus.dll ForkPlus.runtimeconfig.json \
                   "ForkPlus.AskPass${ext}" ForkPlus.AskPass.dll ForkPlus.AskPass.runtimeconfig.json \
                   "ForkPlus.RI${ext}" ForkPlus.RI.dll; do
            [ -f "$f" ] || { echo "MISSING: $f"; missing=1; }
          done
          case "${{ matrix.name }}" in
            windows-x64) native=biturbo.dll ;;
            linux-x64)   native=libbiturbo.so ;;
            macos-arm64) native=libbiturbo.dylib ;;
          esac
          [ -f "$native" ] || { echo "MISSING native: $native"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All critical outputs present (native=$native)."

      - name: Archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd publish
          tar -czf "ForkPlus-${{ matrix.name }}.tar.gz" "${{ matrix.rid }}"

      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "publish/ForkPlus-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForkPlus-${{ matrix.name }}
          path: publish/ForkPlus-${{ matrix.name }}.${{ matrix.ext }}
          retention-days: 14
          if-no-files-found: error
